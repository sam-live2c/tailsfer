[package]
name = "tailsfer-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = "0.11"
rand = "0.9"
sha2 = "0.10"
zeroize = "1"
zstd = "0.13"

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net", "io-util", "fs"]

[dependencies.rcgen]
version = "0.14"

[dependencies.quinn]
version = "0.11"
default-features = false
features = ["runtime-tokio", "rustls"]

[dependencies.rustls]
version = "0.23"
features = ["ring"]
